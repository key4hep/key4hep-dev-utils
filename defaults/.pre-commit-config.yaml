# Do not edit this file, it will be overwritten!
# The template file can be found in
# https://github.com/key4hep/key4hep-dev-utils/blob/main/defaults/.pre-commit-config.yaml
#
# Common pre-commit configuration for Key4hep repositories.
#
# All hooks are fetched and installed by pre-commit itself, i.e. no tools
# (clang-format, ruff, ...) need to be available in the environment. Hook
# versions can be updated with `pre-commit autoupdate`.
#
# Repository specific adjustments that are expected:
#   - licenseheaders: the start year (-y) and additional excludes (-x)
#   - additional `exclude` patterns for generated / vendored files
#   - Python formatting and linting configuration lives in .ruff.toml / pyproject.toml
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^doc/ReleaseNotes\.md$
      - id: end-of-file-fixer
        exclude: ^doc/ReleaseNotes\.md$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    # Keep the major version in sync with the LLVM version in the Key4hep stack
    # (currently 21), to get identical formatting locally and in CI
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/johann-petrak/licenseheaders.git
    rev: v0.8.8
    hooks:
      - id: licenseheaders
        args:
          [
            "-t",
            ".github/templates/apache-2.tmpl",
            "-y2014-2026",
            "-o",
            "Key4hep-Project",
            "-n",
            "Key4hep",
            "-u",
            "https://key4hep.github.io/key4hep-doc/",
            "-x",
            ".github/*",
            ".pre-commit-config.yaml",
            "README.md",
            "doc/ReleaseNotes.md",
            "-f",
          ]
